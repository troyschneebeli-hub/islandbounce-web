name: Weekly booking link check

# Wednesday 09:00 Perth / Bali (UTC+8) = Wednesday 01:00 UTC. Reads every page in our sitemap and checks each booking
# link on them: affiliate ID, sub_id, our booking host, /en/travel/<from>/<to> with known ports, sane date/travellers.
# It only reads OUR site: 12Go's terms don't allow automated access to the booking site (27 Oct 2026).
# Problems open an issue, which emails the owner.
on:
  schedule:
    - cron: '0 1 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check our pages and booking links (read-only, our site only)
        id: check
        run: node scripts/weekly/check_links.mjs "$RUNNER_TEMP/links.md"
      - name: Email the problems
        if: ${{ failure() && steps.check.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "@${{ github.repository_owner }} the weekly booking link check found problems. Broken booking links lose bookings, and a link without our affiliate ID loses the commission."
            echo
            if [ -s "$RUNNER_TEMP/links.md" ]; then head -c 60000 "$RUNNER_TEMP/links.md"; else echo "The check stopped before writing its report."; fi
            echo; echo "Full run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --repo "${{ github.repository }}" --title "Booking link check: problems found ($(date -u +%d\ %b\ %Y))" --body-file "$RUNNER_TEMP/issue.md"
