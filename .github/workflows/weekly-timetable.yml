name: Weekly timetable refresh

# Tuesday 09:00 Perth / Bali (UTC+8) = Tuesday 01:00 UTC.
# Scans the 7 days starting the coming THURSDAY, so sold-out "today/tomorrow" trips cannot hide a sailing.
on:
  schedule:
    - cron: '0 1 * * 2'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Probe mode: only scan the first N routes (e.g. 2) and publish nothing. Leave empty for a full run.'
        required: false
      start_date:
        description: 'Override first day to scan (YYYY-MM-DD). Leave empty for the coming Thursday.'
        required: false

permissions:
  contents: write
  issues: write

concurrency: weekly-timetable

# "shell: bash" turns on pipefail: without it `publish_check.py ... | tee` passes even when the check blocks.
defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      dates: ${{ steps.d.outputs.dates }}
    steps:
      - id: d
        run: |
          START="${{ github.event.inputs.start_date }}"
          if [ -z "$START" ]; then START=$(date -u -d "+2 days" +%F); fi   # Tuesday + 2 = Thursday
          DATES=$(python3 -c "import datetime,json,sys;s=datetime.date.fromisoformat('$START');print(json.dumps([(s+datetime.timedelta(days=i)).isoformat() for i in range(7)]))")
          echo "dates=$DATES" >> "$GITHUB_OUTPUT"; echo "$DATES"

  scan:
    needs: plan
    # Pinned: ubuntu-latest is moving to Ubuntu 26 (from 19 Oct 2026), which Playwright 1.49 doesn't list as supported
    # for `install --with-deps`. Move up together with the Playwright version in scripts/weekly/package.json.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      # Two days at a time, not all seven at once: seven scans in parallel set off 12Go's bot check (23 Oct 2026).
      max-parallel: 2
      matrix:
        date: ${{ fromJSON(needs.plan.outputs.dates) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright (in its own folder so it cannot clash with the site's packages)
        working-directory: scripts/weekly
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Scan 12Go (read-only)
        env:
          LIMIT: ${{ github.event.inputs.limit }}
        run: node scripts/weekly/scan_12go.mjs ${{ matrix.date }} out/scan-${{ matrix.date }}.json
      # The whole out/ folder: the scan plus debug-*.png screenshots of any route that failed or came back empty.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-${{ matrix.date }}
          path: out/
          retention-days: 30

  compile:
    needs: scan
    if: ${{ github.event.inputs.limit == '' }}   # probe runs (limit set) stop after the scan
    runs-on: ubuntu-latest
    outputs:
      reported: ${{ steps.email.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22   # check-data.mjs needs module.registerHooks (Node 22.15+)
      - uses: actions/download-artifact@v4
        with:
          path: scans
          pattern: scan-*
          merge-multiple: true
      - name: Match operator timetables against 12Go
        id: match
        run: |
          python3 scripts/weekly/match.py --scans scans --operators data/operator-sailings.json --out data/generated-new
          cat data/generated-new/report.md >> "$GITHUB_STEP_SUMMARY"   # counts on the run's Summary page
      - name: What changed since last week
        run: node scripts/weekly/changes.mjs --new data/generated-new --old data/generated --out "$RUNNER_TEMP/changes.md"
      - name: Safety checks (blocks the publish if the data looks wrong)
        id: safety
        run: |
          echo '### Safety checks' >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/weekly/publish_check.py --new data/generated-new --old data/generated 2>&1 | tee -a "$RUNNER_TEMP/safety.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish (commit to main, Vercel redeploys)
        id: publish
        run: |
          rm -rf data/generated && mv data/generated-new data/generated
          node scripts/build-confirmed.mjs   # data/generated/*.json -> the JS modules the site imports
          node scripts/check-data.mjs 2>&1 | tee "$RUNNER_TEMP/check-data.txt"   # stops here (nothing pushed) if the site data fails its checks
          git config user.name "timetable-bot"; git config user.email "timetable-bot@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet && { echo "No changes this week"; exit 0; }
          git commit -m "Weekly timetable refresh (scan window from $(python3 -c "import json;print(json.load(open('data/generated/confirmed-sailings.json'))['scannedDates'][0])"))"
          git push origin HEAD:main
      # The weekly "what changed" email: an issue that @mentions the owner, so GitHub emails them.
      # Sent every week once the matcher has run, whether the update was published or blocked.
      - name: Email the weekly report
        id: email
        if: ${{ always() && steps.match.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SAFETY: ${{ steps.safety.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$PUBLISH" = success ]; then STATUS="Published: the site now shows this week's sailings (Vercel redeploys in a few minutes)."; TAG="published"
          elif [ "$SAFETY" = failure ]; then STATUS="BLOCKED by the safety checks: the site still shows last week's sailings. Nothing changed on the site."; TAG="BLOCKED"
          else STATUS="NOT published: a step after the safety checks failed, so the site still shows last week's sailings."; TAG="not published"; fi
          {
            echo "@${{ github.repository_owner }} $STATUS"
            echo
            if [ -s "$RUNNER_TEMP/safety.txt" ]; then echo '### Safety checks'; echo '```'; head -c 6000 "$RUNNER_TEMP/safety.txt"; echo '```'; echo; fi
            # Route pages with no daily sailings this week (they show "Check live times"), and any data check failures.
            if [ -s "$RUNNER_TEMP/check-data.txt" ]; then
              if grep -q '^WARNING:' "$RUNNER_TEMP/check-data.txt"; then echo '### Route pages showing "Check live times" this week'; grep '^WARNING:' "$RUNNER_TEMP/check-data.txt" | sed 's/^WARNING: /- /'; echo; fi
              if grep -q 'check(s) failed' "$RUNNER_TEMP/check-data.txt"; then echo '### Data checks failed'; echo '```'; sed -n '/check(s) failed/,$p' "$RUNNER_TEMP/check-data.txt" | head -c 4000; echo '```'; echo; fi
            fi
            head -c 50000 "$RUNNER_TEMP/changes.md"
            echo; echo "Full run: $RUN"
          } > "$RUNNER_TEMP/issue.md"
          WINDOW=$(head -1 "$RUNNER_TEMP/changes.md" | sed 's/^## Timetable update for sailings //')
          gh issue create --repo "${{ github.repository }}" --title "Timetable $WINDOW: $TAG" --body-file "$RUNNER_TEMP/issue.md"

  notify:
    needs: [scan, compile]
    # Only when the weekly report above could not be sent (it already says whether the update was blocked).
    if: ${{ always() && (needs.scan.result == 'failure' || (needs.compile.result == 'failure' && needs.compile.outputs.reported != 'true')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Open an issue (GitHub emails the repo owner)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue create --repo "${{ github.repository }}" --title "Weekly timetable refresh did not publish" --body "The run was blocked or failed, so last week's data is still live. See ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
